<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata Oluştu - Oracle Security Tool</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-lg">
        <!-- Hata Başlığı -->
        <div class="flex items-center space-x-4 mb-6">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h1 class="text-3xl font-extrabold text-gray-800">İşlem Başarısız</h1>
        </div>
        
        <!-- Hata Mesajı -->
        <p class="text-gray-700 mb-4">Oracle Güvenlik Denetimi sırasında bir hata oluştu.</p>
        
        <div class="bg-red-50 border-l-4 border-red-400 text-red-700 p-4 rounded-md mb-6" role="alert">
            <p class="font-bold mb-2">Hata Detayı:</p>
            <pre class="whitespace-pre-wrap text-sm">{{ error_message }}</pre>
        </div>

        <!-- Yönlendirme Butonu -->
        <a href="{{ url_for('run_assessment') }}" class="w-full inline-block text-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-150 ease-in-out shadow-md">
            Denetim Sayfasına Geri Dön
        </a>
    </div>

</body>
</html>
